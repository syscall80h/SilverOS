# Backend
backend = "glx";
vsync = true;
use-damage = true;

# Opacité
inactive-opacity = 0.9;
active-opacity = 1.0;
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'URxvt'",
  "90:class_g = 'XTerm'",
  "90:class_g = 'kitty'",
  "90:class_g = 'Code'",
  "90:class_g = 'Firefox'",
  "90:class_g = 'Chromium'"
];

# Flou
blur:
{
  method = "gaussian";
  size = 10;
  deviation = 5.0;
};

# Animations
animations = true;
animation-stiffness = 200.0;
animation-dampening = 20.0;
animation-clamping = true;
animation-mass = 1.0;

# Règles de fenêtres
rules = [
  {
    match = "focused";
    opacity = 1.0;
  },
  {
    match = "!focused";
    opacity = 0.9;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    opacity = 1.0;
  }
];

# Ombres
shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.5;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'"
];

# Coins arrondis
corner-radius = 10;
detect-rounded-corners = true;

# Autres options
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;
