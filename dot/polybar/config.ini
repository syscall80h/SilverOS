[global/wm]
include-file = $HOME/.config/polybar/macchiato.ini


[bar/mybar]
background=${colors.base}
border-color=${colors.crust}
border-size=4pt
font-0 = "JetBrainsMono Nerd Font Mono:style=Regular:size=13;2"
font-1 = "Symbols Nerd Font Mono:style=Regular:size=16;2"
foreground=${colors.surface0}

width = 100%
height = 24pt
radius = 6


; dpi = 96


line-size = 3pt

margin-top = 1
padding-left = 1
padding-right = 3

module-margin = 1

separator = " "
separator-foreground = ${colors.transparent}

modules-left = launcher xworkspaces xwindow
modules-right = filesystem pulseaudio xkeyboard memory cpu battery date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/launcher]
type = custom/text
content = %{T2}%{F#ed8796}î½%{F-}%{T-}
click-left = kitty & disown



[module/xworkspaces]
type = internal/xworkspaces

icon-0 = Home;ï€•
icon-1 = Web;ó°–Ÿ
icon-2 = Files;ï“”
icon-3 = Code;î£š

label-active = %icon% %name%
label-active-foreground = ${colors.text}
label-active-background = ${colors.base}
label-active-underline= ${colors.text}
label-active-padding = 4

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.subtext0}

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.subtext1}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.teal}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /


label-mounted = %{T2}î¾%{T-} %mountpoint% %percentage_used%% used
label-mounted-foreground = ${colors.flamingo}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.transparent}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "%{T2}ï€¨%{T-} "
format-volume-prefix-foreground = ${colors.green}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.green}

label-muted = "%{T2}î»¨%{T-} muted"
label-muted-foreground = ${colors.green}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.sky}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = custom/script
interval = 2
#format-prefix = "%{T2}î¿… %{T-}"
#format-prefix-foreground = ${colors.mauve}
#label = %percentage_used:2%%
label-foreground = ${colors.mauve}
exec = echo "%{T2}î¿… %{T-} $(free -h | awk '/^Mem:/ {print $3 "/" $2}')"
click-left = kitty btop & disown


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T2}ï’¼ %{T-} "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%
label-foreground = ${colors.peach}
click-left = kitty btop & disown

[module/battery]
type = internal/battery
battery = BAT1
time-format = %H:%M
full-at = 80

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-full-foreground = ${colors.green}
label-low-foreground = ${colors.red}
label-discharging-foreground = ${colors.lavender}
label-charging-foreground = ${colors.peach}

ramp-capacity-0 = %{T2}%{F#ed8796}ï‰„%{F-}%{T-}
ramp-capacity-1 = %{T2}%{F#ed8796}ï‰ƒ%{F-}%{T-}
ramp-capacity-2 = %{T2}%{F#eed49f}ï‰‚%{F-}%{T-}
ramp-capacity-3 = %{T2}%{F#a6da95}ï‰%{F-}%{T-}
ramp-capacity-4 = %{T2}%{F#a6da95}ï‰€%{F-}%{T-}

animation-charging-0 = %{T2}%{F#FFA500}ï‰„%{F-}%{T-}
animation-charging-1 = %{T2}%{F#FFA500}ï‰ƒ%{F-}%{T-}
animation-charging-2 = %{T2}%{F#FFA500}ï‰‚%{F-}%{T-}
animation-charging-3 = %{T2}%{F#FFA500}ï‰%{F-}%{T-}
animation-charging-4 = %{T2}%{F#FFA500}ï‰€%{F-}%{T-}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

date = %d/%m/%y %H:%M
date-alt = %d/%m/%y %H:%M:%S
label-foreground = ${colors.text}

[module/powermenu]
type = custom/text

content = %{T2}ï€‘%{T-}
content-background = ${colors.base}
content-foreground = ${colors.red}

click-left = ~/.config/rofi/powermenu/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
