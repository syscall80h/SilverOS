[global/wm]
include-file = $HOME/.config/polybar/macchiato.ini


[bar/mybar]
background=${colors.base}
border-color=${colors.crust}
border-size=4pt
font-0 = "JetBrainsMono Nerd Font Mono:style=Regular:size=13;2"
font-1 = "Symbols Nerd Font Mono:style=Regular:size=16;2"
foreground=${colors.surface0}

width = 100%
height = 24pt
radius = 6

; dpi = 96


line-size = 3pt


padding-left = 3
padding-right = 3

module-margin = 2

separator = " "
separator-foreground = ${colors.transparent}

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

icon-0 = Home;ï€•
icon-1 = Web;ó°–Ÿ
icon-2 = Files;ï“”
icon-3 = Code;î£š

label-active = %icon% %name%
label-active-foreground = ${colors.text}
label-active-background = ${colors.base}
label-active-underline= ${colors.text}
label-active-padding = 4

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.overlay1}

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.subtext1}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.teal}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /


label-mounted = %{T2}î¾%{T-} %mountpoint% %percentage_used%% used
label-mounted-foreground = ${colors.text}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.transparent}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "%{T2}ï€¨%{T-} "
format-volume-prefix-foreground = ${colors.green}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.green}

label-muted = "%{T2}î»¨%{T-} muted"
label-muted-foreground = ${colors.green}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.text}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.text}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.text}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.text}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
